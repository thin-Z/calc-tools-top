    <main id="main">
        <div class="tool-container">
            <h1>密码强度检测器</h1>
            <p class="tool-description">实时检测密码安全性，给出评分和改进建议，支持生成强密码。</p>

            <div class="calculator-form">
                <div class="input-group">
                    <label for="password">输入密码</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" placeholder="请输入要检测的密码" autocomplete="off">
                        <button type="button" id="toggle-password" class="toggle-password" aria-label="显示密码">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="result-area" id="result-area">
                    <div class="strength-meter">
                        <div class="meter-bar" id="meter-bar"></div>
                    </div>
                    <div class="strength-info">
                        <span class="strength-level" id="strength-level">请输入密码</span>
                        <span class="strength-score" id="strength-score">0/100</span>
                    </div>
                    <div class="strength-feedback" id="strength-feedback"></div>
                </div>

                <div class="button-group">
                    <button type="button" id="generate-btn" class="btn btn-primary">生成强密码</button>
                    <button type="button" id="copy-btn" class="btn btn-secondary" disabled>复制密码</button>
                </div>

                <div class="generated-password hidden" id="generated-password">
                    <label>生成的密码：</label>
                    <div class="password-display">
                        <code id="generated-password-text"></code>
                    </div>
                </div>
            </div>

            <div class="tool-info">
                <h2>密码安全小贴士</h2>
                <ul>
                    <li>使用至少12位字符的密码</li>
                    <li>混合使用大小写字母、数字和特殊符号</li>
                    <li>避免使用生日、姓名等个人信息</li>
                    <li>不要在多个网站使用相同密码</li>
                    <li>考虑使用密码管理器</li>
                </ul>
            </div>
        </div>
