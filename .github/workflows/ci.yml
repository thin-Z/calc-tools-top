name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (dist)
        run: node scripts/build.mjs

      - name: Verify site (build → verify → link/jsonld/CSP/a11y/SRI 断言 1-15)
        run: node scripts/verify-site.mjs

      - name: Unit tests (node --test)
        # 显式 glob 限定 js/test + api/test，避免把 dist 内的测试副本再跑一遍
        run: node --test "js/test/*.test.js" "api/test/*.test.js"

      - name: Coverage gate (lines ≥80%)
        # Node 22 实验性覆盖率：--experimental-test-coverage 开启，
        # --test-coverage-lines=80 / --test-coverage-branches=80 / --test-coverage-functions=80 设阈值。
        # 实测本地（排除环境 shim 后）: lines 89.34 / branches 81.00 / funcs 84.09。
        # 若 CI Node 版本不支持该 flag，由脚本解析覆盖率输出断言 lines>=80（见架构设计 T05）。
        run: node --test --experimental-test-coverage --test-coverage-lines=80 --test-coverage-branches=80 --test-coverage-functions=80 "js/test/*.test.js" "api/test/*.test.js"
