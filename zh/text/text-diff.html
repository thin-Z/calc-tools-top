<body>
    <header>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <a href="/" class="logo"><img src="/assets/logo-h.svg" alt="工具箱里" class="site-logo"></a>
    <nav>
        <a href="/"><span>首页</span></a>
        <select class="lang-switch" data-csp-change="switchLang" aria-label="语言切换">
            <option value="zh" selected>🇨🇳 中文</option>
            <option value="en">🇬🇧 English</option>
        </select>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换暗黑模式"><span class="theme-icon">☀️</span></button>
    </nav>
</header>
    <main id="main">
        <div class="tool-page">
            <div class="tool-header">
                <h1>🔍 文本对比工具</h1>
                <p>并排比较两个文本，高亮显示新增、删除与未变更的内容。</p>
            </div>
            <div class="detail-like-wrap"><button class="like-btn detail-like" data-like-id="text-diff"><span class="heart">❤</span> <span class="count">0</span></button></div>

            

            <div class="diff-container">
                <div class="diff-pane">
                    <label class="st-34">原始文本</label>
                    <textarea class="text-input" id="textInput1" placeholder="输入第一段文本..." data-csp-input="scheduleDiff">你好，欢迎使用文本对比工具！
这是第一行。
第三行未改变。</textarea>
                </div>
                <div class="diff-pane">
                    <label class="st-34">新文本</label>
                    <textarea class="text-input" id="textInput2" placeholder="输入第二段文本..." data-csp-input="scheduleDiff">你好，欢迎使用文本对比工具！
这是修改后的第二行。
第三行未改变。
第四行是新内容。</textarea>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn btn-primary" data-csp-click="doDiff">🔄 对比</button>
                <button class="btn btn-secondary" data-csp-click="clearDiff">清空</button>
            </div>

            <div id="diffStats" class="diff-stats"></div>

            <div class="diff-output">
                <div class="diff-pane-result">
                    <div class="diff-header">原始</div>
                    <div class="diff-content" id="diffLeft"></div>
                </div>
                <div class="diff-pane-result">
                    <div class="diff-header">新</div>
                    <div class="diff-content" id="diffRight"></div>
                </div>
            </div>

            <div class="seo-content">
                <h2>关于文本对比</h2>
                <p>文本对比是一种比较两个文本块差异的技术。本工具使用 LCS（最长公共子序列）算法进行逐行比较。</p>
                <ul>
                    <li><strong class="st-35">绿色背景</strong>：新增内容</li>
                    <li><strong class="st-11">红色背景 + 删除线</strong>：删除内容</li>
                    <li><strong>白色背景</strong>：未变更内容</li>
                </ul>
                <h3>使用场景</h3>
                <ul>
                    <li>代码版本对比</li>
                    <li>文章修改前后对比</li>
                    <li>文档校对</li>
                    <li>数据差异分析</li>
                </ul>
            </div>
        </div>
