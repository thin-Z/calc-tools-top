name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (dist)
        run: node scripts/build.mjs

      - name: Verify site (build → verify → link/jsonld/CSP/a11y/SRI 断言 1-15)
        run: node scripts/verify-site.mjs

      - name: Unit tests (node --test)
        # 显式 glob 限定 js/test + api/test，避免把 dist 内的测试副本再跑一遍
        run: node --test "js/test/*.test.js" "api/test/*.test.js"

      - name: Coverage gate (lines/branches/functions ≥80%)
        # 统一走 package.json 的 test:cov：阈值与 --test-coverage-exclude(**/js/calculators/**、
        # **/js/like.js，排除浏览器 UI 逻辑) 与本地/Maintainer 完全一致，
        # 避免 CI 复制命令时漏排除把 funcs 拉到阈值以下（本 bug：CI 缺 exclude → 78.39% < 80%）。
        # 注意：Node 22 支持阈值与 exclude；Node 20 不支持（bad option），本地须用 node>=22。
        run: npm run test:cov

  e2e:
    # T1.5 E5 Playwright 常驻 E2E 套件（Phase 1, D4 决策）：49 工具交互 + help/embed/PWA + 已知 bug 回归
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (playwright)
        run: npm ci

      - name: Install Chromium browser
        shell: bash
        run: |
          # GitHub ubuntu-24.04 runner 预装 Microsoft apt 源(azure-cli / ubuntu-prod)，
          # 其对 packages.microsoft.com 会间歇性 403，导致 `playwright install --with-deps`
          # 内部 apt-get update 失败。Chromium 依赖来自 Ubuntu archives + dl.google.com，
          # 与 Microsoft 源无关，故先移除这些源再安装，并加一层重试兜底。
          sudo rm -f /etc/apt/sources.list.d/microsoft-*.list /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "playwright install 第 ${i} 次失败，重试..."; sleep 8
          done
          exit 1

      - name: Build (dist)
        run: node scripts/build.mjs

      - name: Run E2E suite
        env:
          CI: 'true'
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
