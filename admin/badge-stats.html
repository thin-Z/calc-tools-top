<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/js/theme-init.js"></script>
    <script src="/js/theme-toggle.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吧唧制作 · 运营统计</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <meta name="description" content="在线吧唧制作工具的访问点击与用户点赞汇总（中英文合并统计）内部运营视图。">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <script src="/js/i18n.js" defer></script>
    <script src="/js/admin/badge-stats.js" defer></script>
</head>
<body>
    <header>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <a href="/" class="logo"><img src="/assets/logo-h.svg" alt="工具箱里" class="site-logo logo-light" width="180" height="45" aria-hidden="true"><img src="/assets/logo-h-dark.svg" alt="工具箱里" class="site-logo logo-dark" width="180" height="45"></a>
    <nav>
        <a href="/"><span>首页</span></a>
        <select class="lang-switch" data-csp-change="switchLang" aria-label="语言切换">
            <option value="zh" selected>中文</option>
            <option value="en">English</option>
        </select>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换暗黑模式"><span class="theme-icon"><svg class="ic" aria-hidden="true"><use href="/assets/icons/icons.svg#icon-sun"></use></svg></span></button>
    </nav>
</header>

    <main id="main">
        <div class="admin-dash">
            <h1>吧唧制作 · 运营统计</h1>
            <p class="admin-sub">在线吧唧制作工具的访问点击与用户点赞汇总（中英文合并统计）。</p>

            <div class="stat-grid">
                <div class="stat-card is-clicks">
                    <div class="stat-num" id="stat-clicks">—</div>
                    <div class="stat-label">总访问点击</div>
                </div>
                <div class="stat-card is-likes">
                    <div class="stat-num" id="stat-likes">—</div>
                    <div class="stat-label">总点赞</div>
                </div>
            </div>

            <div class="admin-actions">
                <button id="btn-refresh" class="btn btn-primary">刷新数据</button>
                <div class="admin-meta" id="stat-updated"></div>
                <div class="admin-meta" id="stat-error" role="status" aria-live="polite"></div>
            </div>

            <p class="admin-note">
                数据来自公开聚合接口 <code>/api/clicks?tools=badge-maker</code> 与
                <code>/api/likes?tools=badge-maker</code>，由 Vercel KV 实时计数。
                内部运营视图，不对外索引。点击防刷与点赞每日上限由后端限速保护。
            </p>
        </div>
    </main>

    <footer>
    <div class="footer-links">
        <a href="/">首页</a>
        <a href="/help">帮助</a>
        <a href="/about">关于</a>
        <a href="/privacy">隐私政策</a>
        <a href="/contact">联系</a>
        <a href="/blog/zh/">博客</a>
    </div>
    <p>© 2026 工具箱里 | 免费在线工具</p>
</footer>
</body>
</html>
